[package]
name = "dither-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Dithers photos to a fixed six-colour palette"
readme = "README.md"

[lib]
name = "dither_core"
path = "src/lib.rs"

[[bin]]
name = "dither-core"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "pipeline"
harness = false
required-features = ["image-io"]

[features]
default = ["cli"]
# Image decoding and palette PNG encoding.
image-io = ["dep:png", "image/jpeg", "image/png"]
# Row-level threading in the hot stages. Off for wasm, which has no threads.
parallel = ["dep:rayon"]
# The command line front end.
cli = ["image-io", "parallel", "dep:clap"]

[dependencies]
# Buffers, resampling, Floyd-Steinberg error diffusion and colour indexing.
image = { version = "0.25", default-features = false }
# CIELAB colour science behind the nearest-colour search.
palette = { version = "0.7.7", default-features = false, features = ["std"] }
# Palette PNG output, which `image` cannot write.
png = { version = "0.18", optional = true }
# Row-level parallelism in the hot stages, and the CLI's batch loop.
rayon = { version = "1.11", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
