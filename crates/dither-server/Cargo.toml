[package]
name = "dither-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP backend exposing the core dithering pipeline"

[lib]
name = "dither_server"
path = "src/lib.rs"

[[bin]]
name = "dither-server"
path = "src/main.rs"

[dependencies]
# The pipeline itself. No CLI, but the byte-level image codecs.
dither-core = { workspace = true, features = ["image-io"] }

axum = { workspace = true, features = ["multipart"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
serde_json = { workspace = true }
# Drives the router in-process, so the API tests need no socket.
tower = { workspace = true, features = ["util"] }
